[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentinabox"
version = "0.1.0"
description = "Dockerized AI code review sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.30.0",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.12.0",
    "jinja2>=3.1.0",
    "github-copilot-sdk>=0.1.0",
    "json-repair>=0.50.0",
    "cryptography>=44.0.0",
    "anthropic>=0.86.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["server*", "eval*"]
